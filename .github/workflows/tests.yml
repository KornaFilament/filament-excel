name: Tests
on:
  pull_request:
  push:
    branches:
      - main
  # Dependencies are resolved fresh on every run, so this picks up new Filament
  # releases within a day of them landing.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  pest:
    name: PHP ${{ matrix.php }} / Filament ${{ matrix.filament }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        filament: ['^4.0', '^5.0']

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Git checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: composer update -n --prefer-dist -W --with="filament/tables:${{ matrix.filament }}"

      - name: Run Pest
        run: ./vendor/bin/pest
